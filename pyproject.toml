[project]
name = "hl7-inspector"
version = "1.0.0"
description = "HL7 v2 inspector, validator, and converter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]